name: mirai_cook
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  google_sign_in: ^7.2.0
  googleapis: ^18.0.0
  googleapis_auth: ^2.3.7
  html: ^0.15.7
  http: ^1.6.0
  image: ^4.12.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  sqlite3: ^3.9.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  drift_dev: ^2.35.2
  meta: ^1.19.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon: regenerate with `dart run flutter_launcher_icons` after changing
# assets/icon/ (source drawing: assets/icon/pot.svg).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#E07A3F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # The drawing already sits inside the safe zone: no extra inset.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

# Native build hook options.
hooks:
  user_defines:
    sqlite3:
      # Host builds on Linux (flutter test in CI and dev containers) load the
      # system SQLite instead of downloading a prebuilt binary from GitHub
      # releases, so tests don't depend on github.com being reachable.
      # Android (and other platforms) keep the bundled, downloaded library.
      source:
        linux: system
      name_linux: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0
