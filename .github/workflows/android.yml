name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # Called by release.yml to build the APK for a release.
  workflow_call:
    inputs:
      build-name:
        description: Version name for the APK (e.g. 0.1.0)
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' || {
            echo "::error::Generated files are stale. Run build_runner and commit."
            exit 1
          }

      - run: flutter analyze

      - run: flutter test

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.name }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and commit count for versioning

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: signing with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # Version name:
      # - given by release.yml (manual release), or
      # - on a push to main: latest vX.Y.Z tag with the patch bumped
      #   (pubspec version if there is no tag yet) -> automatic release, or
      # - otherwise: pubspec version + short sha (test build, no release).
      # Version code: commit count, so it always grows along main.
      - name: Compute version
        id: version
        env:
          BUILD_NAME: ${{ inputs.build-name }}
          AUTO_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          base=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          release=false
          if [ -n "$BUILD_NAME" ]; then
            name="$BUILD_NAME"
          elif [ "$AUTO_RELEASE" = "true" ]; then
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
            if [ -z "$latest" ]; then
              name="$base"
            else
              IFS=. read -r major minor patch <<< "$latest"
              name="$major.$minor.$((patch + 1))"
            fi
            release=true
          else
            name="${base}-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "Version $name (code $(git rev-list --count HEAD)), release=$release"

      # The sqlite3 build hook downloads prebuilt Android libraries from
      # GitHub releases; keep them across runs (the hook reuses files whose
      # hash matches) so a GitHub download outage doesn't block releases.
      - uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3-native-${{ hashFiles('pubspec.lock') }}

      - name: Build release APK
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.code }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          # Retry: native asset downloads from GitHub can fail transiently.
          for attempt in 1 2 3; do
            if flutter build apk --release \
                --build-name="$BUILD_NAME" \
                --build-number="$BUILD_NUMBER" \
                --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed, retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/mirai-cook-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mirai-cook-apk
          path: dist/*.apk
          retention-days: 30

  # Automatic release on every push to main (e.g. a merged PR). The tag is
  # created with GITHUB_TOKEN, which does not trigger other workflow runs.
  release:
    name: Publish release
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mirai-cook-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Mirai Cook ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
